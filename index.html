<!DOCTYPE html> <!--serve para identificar a linguagem de programação que está sendo utilizada.-->
<html lang="pt-br"> <!--abertura do documento, delimita o espaço de codificação. Todas as tags devem ser colocadas nesse espaço-->
<head> <!--tag define o cabeçalho do documento. Tudo que for escrito dentro dessa tag não aparecerá na pagina principal. Dentro dessa tag-->
    <meta charset="UTF-8"> <!-- especifica qual o conjunto de caracteres (character set ou charset), será usado para redenrizar o texto da página.-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--fornece os metadados sobre a sua página-->
    <title>Portfólio</title>
</head>
<body>
    
</body>
</html> <!--fechamento da tag, documento.-->

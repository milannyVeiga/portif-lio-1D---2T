<!DOCTYPE html> <!--serve para identificar a linguagem de programação que está sendo utilizada.-->
<html lang="pt-br"> <!--abertura do documento, delimita o espaço de codificação. Todas as tags devem ser colocadas nesse espaço-->
<head> <!--tag define o cabeçalho do documento. Tudo que for escrito dentro dessa tag não aparecerá na pagina principal. Dentro dessa tag-->
    <meta charset="UTF-8"> <!-- especifica qual o conjunto de caracteres (character set ou charset), será usado para redenrizar o texto da página.-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--fornece os metadados sobre a sua página-->
    <title>Portfólio</title> <!-- título da página-->
</head> <!-- fechamento do cabeçalho-->
<body> <!-- nesse espaço está contido o conteúdo visual da página. As tags que representam texto, botões er outros, devem ser adicionadas nesse intervalo.-->
    <!-- um documento HTML é composto por tags que são escritas  entre < >. as tags precisam ser abertas e fechadas, o que as diferenciam é que tags de fechamentyto possuem uma / antes do nome. alguns códigos não precisam da </> para fechamento, apenas da barra, ou nem isso, como no  caso da tag meta. outro aspecto importante é que ela é case insentitive, ou seja, não leva em consideração a diferença entrer letras oficiais e minúsculas. <-->

<h1>matemática</h1>
<h2>história</h2>
<h3>geografia</h3>
<h4>português</h4>
<h5>física/h5>

</body>
</html> <!--fechamento da tag, documento.-->
